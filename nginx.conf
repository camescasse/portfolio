server {
  listen 80;
  server_name _;

  # Do not show the nginx version in headers and error pages.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|mjs|json|svg|ico|png|jpg|jpeg|gif|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
